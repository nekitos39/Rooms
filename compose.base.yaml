# БАЗОВЫЕ ЯКОРЯ
x-env-file: &env_file [.env]

x-db-env: &db_env
  MARIADB_DATABASE: ${MARIADB_DATABASE}
  MARIADB_USER: ${MARIADB_USER}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD}
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

x-fastify-env: &fastify_env
  DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
  PORT: "3000"

x-db-healthy: &db_healthy
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    env_file: *env_file
    environment: *db_env
    volumes: [ "db_data:/var/lib/mysql" ]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *db_healthy
    env_file: *env_file
    build:
      context: ./backend
      dockerfile: Dockerfile
      # target задаётся в override-файлах (dev/prod)
    environment: *fastify_env
    expose: ["3000"]

  scalar:
    image: scalarapi/api-reference:latest
    environment:
      API_REFERENCE_CONFIG: >
        {"layout":"modern","theme":"purple",
         "sources":[{"name":"API","url":"/openapi.json"}]}
    expose: ["8080"]

volumes:
  db_data: